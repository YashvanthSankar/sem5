/* Layout: lab bench split in two. Left = worked example (cobalt, exam data); right = practice (green, factory and service data). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5a6575; --line:#d5dbe3; --soft:#f5f7fa;
  --ex:#2c55c9; --ex-tint:#e8eefb; --ex-ink:#1f3f9a;
  --pr:#0c7d60; --pr-tint:#e3f3ed; --pr-ink:#0a5e48;
  --ok:#1b8a45; --ok-tint:#e2f4e8; --bad:#c0392f; --bad-tint:#fbe8e6; --warn:#a86b0c; --warn-tint:#fbf0dc;
  --code-bg:#fbfcfd; --code-ink:#1d2632; --kw:#7a2fb5; --str:#0b7a4b; --num:#b4511d; --com:#7d8796; --fn:#1f4fb5;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e5eaf1; --muted:#9aa5b5; --line:#2c3644; --soft:#202935;
  --ex:#7b9cf5; --ex-tint:#1d2943; --ex-ink:#a9bff8;
  --pr:#4cc59f; --pr-tint:#16312a; --pr-ink:#8adcc0;
  --ok:#5ccf87; --ok-tint:#183324; --bad:#f07a6e; --bad-tint:#3a1d1b; --warn:#e8b45a; --warn-tint:#3a2d14;
  --code-bg:#151b23; --code-ink:#dbe2ec; --kw:#c89bf0; --str:#7fd6a6; --num:#f2a26f; --com:#7c8797; --fn:#8fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e5eaf1; --muted:#9aa5b5; --line:#2c3644; --soft:#202935;
  --ex:#7b9cf5; --ex-tint:#1d2943; --ex-ink:#a9bff8;
  --pr:#4cc59f; --pr-tint:#16312a; --pr-ink:#8adcc0;
  --ok:#5ccf87; --ok-tint:#183324; --bad:#f07a6e; --bad-tint:#3a1d1b; --warn:#e8b45a; --warn-tint:#3a2d14;
  --code-bg:#151b23; --code-ink:#dbe2ec; --kw:#c89bf0; --str:#7fd6a6; --num:#f2a26f; --com:#7c8797; --fn:#8fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ex);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:19px;font-weight:600;line-height:1.2}
.brand h1 .arrow{color:var(--muted);font-weight:500}
.brand h1 .l{color:var(--ex)} .brand h1 .r{color:var(--pr)}
.pystat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--soft);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.pystat.ready .dot{background:var(--ok)} .pystat.fail .dot{background:var(--bad)}
.pystat.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.overall{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}

/* module rail */
.rail{display:flex;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.mod{flex:none;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);text-align:left}
.mod:hover{background:var(--soft);color:var(--ink)}
.mod[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.mod .num{font-family:var(--f-head);font-weight:700;font-size:15px}
.ring{width:18px;height:18px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--pr);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.mod[aria-selected="true"] .ring .bg{stroke:color-mix(in srgb,var(--surface) 30%,transparent)}

/* mobile pane switch */
.switch{display:none;padding:8px 16px;gap:6px;background:var(--surface);border-bottom:1px solid var(--line)}
.switch button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:7px;font-weight:600;font-size:13px}
.switch button[aria-pressed="true"].l{background:var(--ex);border-color:var(--ex);color:#fff}
.switch button[aria-pressed="true"].r{background:var(--pr);border-color:var(--pr);color:#fff}

/* split */
.split{flex:1;display:grid;grid-template-columns:var(--lw,50%) 8px 1fr;min-height:0}
.pane{overflow-y:auto;min-width:0;scroll-behavior:smooth}
.pane.left{background:linear-gradient(var(--ex-tint),var(--ex-tint)) top/100% 3px no-repeat,var(--bg)}
.pane.right{background:linear-gradient(var(--pr-tint),var(--pr-tint)) top/100% 3px no-repeat,var(--bg)}
.gutter{background:var(--line);cursor:col-resize;position:relative}
.gutter::after{content:"";position:absolute;left:2px;top:50%;width:4px;height:36px;margin-top:-18px;border-radius:4px;background:var(--muted);opacity:.5}
.gutter:hover,.gutter.drag{background:var(--muted)}
.inner{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:3;margin-inline:-20px;padding:12px 20px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.left .tag{color:var(--ex)} .right .tag{color:var(--pr)}
.tag .ds{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.phead h2{font-size:22px;font-weight:600;line-height:1.2}
.goal{color:var(--muted);margin:0}
details.cols{font-size:13px;color:var(--muted)}
details.cols summary{cursor:pointer;color:var(--ink);font-weight:500;width:max-content}
details.cols table{margin-top:6px}
.setup{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;white-space:pre-wrap}
.setup b{font-family:var(--f-ui);font-weight:600;color:var(--ink);font-size:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:130px;transition:opacity .2s,box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--ex)}
.chead{display:flex;align-items:baseline;gap:10px}
.sn{font-family:var(--f-head);font-weight:700;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.left .sn{color:var(--ex)} .right .sn{color:var(--pr)}
.q{margin:0;min-width:0}
.state{margin-left:auto;flex:none;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.state.done{background:var(--ok-tint);color:var(--ok)}
.state.todo{background:var(--soft);color:var(--muted)}
.card.waiting{opacity:.62}
.card.waiting:hover,.card.waiting:focus-within{opacity:1}
.link{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border:1px solid var(--ex);color:var(--ex-ink);background:var(--ex-tint);border-radius:99px;padding:2px 10px}
.link.pending{border-color:var(--warn);color:var(--warn);background:var(--warn-tint)}
.link:hover{filter:brightness(.97)}

/* code cell */
.cell{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.cellbar{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-bottom:1px solid var(--line);background:var(--soft);font-size:12px;color:var(--muted)}
.cellbar .lbl{margin-right:auto;font-family:var(--f-mono)}
.run{border:none;border-radius:6px;padding:4px 12px;font-size:12.5px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:6px}
.left .run{background:var(--ex)} .right .run{background:var(--pr)}
.run:disabled{opacity:.55;cursor:wait}
.ghost{border:none;background:none;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted)}
.ghost:hover{background:var(--line);color:var(--ink)}
.CodeMirror{height:auto;font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--code-bg);color:var(--code-ink)}
.CodeMirror-scroll{min-height:44px;max-height:420px}
.CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--com)}
.CodeMirror-cursor{border-left:2px solid var(--ink)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:color-mix(in srgb,var(--ex) 22%,transparent)}
.cm-s-default .cm-keyword{color:var(--kw)} .cm-s-default .cm-string{color:var(--str)} .cm-s-default .cm-number{color:var(--num)}
.cm-s-default .cm-comment{color:var(--com);font-style:italic} .cm-s-default .cm-builtin{color:var(--fn)} .cm-s-default .cm-def{color:var(--fn)}
.cm-s-default .cm-variable,.cm-s-default .cm-variable-2,.cm-s-default .cm-property{color:var(--code-ink)} .cm-s-default .cm-operator{color:var(--muted)}
.cm-s-default .cm-meta{color:var(--kw)}
textarea.fallback{width:100%;min-height:120px;border:0;padding:10px;font-family:var(--f-mono);font-size:13px;background:var(--code-bg);color:var(--code-ink);resize:vertical;box-sizing:border-box}
.out{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto;font-size:12.5px}
.out:empty{display:none}
.out pre{margin:0;font-family:var(--f-mono);font-size:12px;white-space:pre;color:var(--ink)}
.out pre.err{color:var(--bad);white-space:pre-wrap}
.out .note{color:var(--muted);font-style:italic;font-size:12px}
.out img{max-width:100%;background:#fff;border-radius:6px;align-self:flex-start}
.out .df{overflow-x:auto}
.out table.dataframe,table.mini{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.out table.dataframe th,.out table.dataframe td{border-bottom:1px solid var(--line);padding:3px 9px;text-align:right;white-space:nowrap}
.out table.dataframe thead th{border-bottom:2px solid var(--line);color:var(--ink)}
.out table.dataframe tbody th{color:var(--muted);font-weight:500}
table.mini{width:100%;margin:4px 0}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.mini th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chk{font-size:12.5px;padding:6px 10px;border-radius:6px;display:flex;gap:8px;align-items:flex-start}
.chk.pass{background:var(--ok-tint);color:var(--ok)} .chk.fail{background:var(--bad-tint);color:var(--bad)}


.hintbtn{color:var(--warn)}
.hintbox{border-top:1px dashed var(--warn);background:var(--warn-tint);padding:6px 10px 8px}
.hinthead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--warn)}
.hinthead span{margin-right:auto}
.hintbox pre{margin:4px 0 0;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;color:var(--ink)}
/* reveal */
.reveal{border-top:1px dashed var(--line);padding-top:8px}
.reveal summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ex-ink);list-style:none;display:inline-flex;gap:6px;align-items:center}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::before{content:"▸";transition:transform .15s}
.reveal[open] summary::before{transform:rotate(90deg)}
.reveal .ansbody{margin-top:6px;padding:8px 12px;border-left:3px solid var(--ex);background:var(--ex-tint);border-radius:0 6px 6px 0}
.reveal .ansbody p{margin:.4em 0 0}

/* mcq */
.mcq{display:flex;flex-direction:column;gap:6px}
.mcq .mq{font-weight:600;font-size:13.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:7px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.opt:hover{border-color:var(--pr)}
.opt .k{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.why{font-size:13px;padding:7px 10px;border-radius:6px;background:var(--soft);border-left:3px solid var(--muted)}
.why.ok{border-left-color:var(--ok)} .why.no{border-left-color:var(--bad)}

/* classify */
.cls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 22px;gap:6px 10px;align-items:center;font-size:13px}
.cls label{font-family:var(--f-mono);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.cls select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.cls .mk{font-weight:700;text-align:center}
.mk.y{color:var(--ok)} .mk.n{color:var(--bad)}

/* observation + log + findings */
.obs{display:flex;flex-direction:column;gap:4px}
.obs label{font-size:12px;font-weight:600;color:var(--muted)}
.obs input,.tbl input,.tbl textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.obs input:focus,.tbl input:focus,.tbl textarea:focus{border-color:var(--pr);outline:none}
.tbl{display:flex;flex-direction:column;gap:6px}
.tbl .row{display:grid;gap:6px;align-items:start}
.tbl.log .row{grid-template-columns:2fr .7fr 2fr 28px}
.tbl.find .row{grid-template-columns:1fr 1fr}
.tbl .hd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl textarea{min-height:52px;resize:vertical}
.obslist{font-size:13px;margin:0;padding-left:18px;color:var(--ink)}
.obslist li{margin:2px 0}
.obslist .sn2{font-family:var(--f-mono);font-size:11.5px;color:var(--pr)}
.empty{color:var(--muted);font-style:italic;font-size:13px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px}
.modal textarea{flex:1;min-height:320px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--code-bg);color:var(--code-ink)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:13px;z-index:30}

.loadmsg{font-size:12.5px;color:var(--warn);background:var(--warn-tint);border-radius:8px;padding:8px 12px}
.loadmsg.fail{color:var(--bad);background:var(--bad-tint)}

@media (max-width: 900px){
  body{overflow:auto;height:auto}
  .switch{display:flex}
  .split{display:block}
  .gutter{display:none}
  .pane{overflow:visible}
  .pane[data-hide="1"]{display:none}

  .overall .bar{width:70px}

.schem .arr{align-self:center;font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.schem .arr i{display:block;font-style:normal;font-size:22px;color:var(--ink)}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:g}

    const mark = () => { S.leftRun[st.n] = true; save(); refreshLinks(); };
    card.append(h("div", { class: "chead" }, h("span", { class: "sn", text: st.n }), h("p", { class: "q", html: st.q })));

      before: () => prior.filter(s => !sessionRan.has(s.n)).map(s => ({ n: s.n, code: S.codes["L" + s.n] ?? s.code })),
      onRun: r => { if (!r.error) { sessionRan.add(st.n); mark(); } } }));
    const det = h("details", { class: "reveal" }, h("summary", { text: st.code ? "Show answer (predict first, then run)" : "Show answer" }), h("div", { class: "ansbody", html: st.ans }));
    det.addEventListener("toggle", () => { if (det.open && !st.code) mark(); });
    card.append(det);
    L.append(card);
  });
}

// ---------- right pane ----------
function taskDone(t) {
  let parts = 0, ok = 0;
  if (t.mcq) t.mcq.forEach((m, i) => { parts++; if (S.mcq[t.n + "#" + i]?.pick === m.a) ok++; });
  if (t.check) { parts++; if (S.checks[t.n] === "pass") ok++; }
  if (t.code != null && !t.mcq && !t.check) { parts++; if (S.ran[t.n]) ok++; }
  if (t.written) { parts++; if ((S.obs[t.n] || "").trim().length >= 20) ok++; }
  return parts > 0 && ok === parts;
}
function modProgress(m) { const t = PR[m - 1].tasks; return t.filter(taskDone).length / t.length; }

function refreshProgress() {
  const all = allTasks(), d = all.filter(taskDone).length;
  $("#ovtxt").textContent = `${d} / ${all.length} practice tasks`;
  $("#ovbar").style.width = (d / all.length * 100) + "%";
  document.querySelectorAll(".mod").forEach(b => { const p = modProgress(+b.dataset.m); b.querySelector(".fg").style.strokeDasharray = `${p * 43.98} 43.98`; });
  document.querySelectorAll(".right .card[data-n]").forEach(c => {
    const t = all.find(x => x.n === c.dataset.n), st = c.querySelector(".state");
    if (!t || !st) return; const dn = taskDone(t);
    st.className = "state " + (dn ? "done" : "todo"); st.textContent = dn ? "✓ Done" : "To do";
  });
}
function refreshLinks() {
  document.querySelectorAll(".right .card[data-link]").forEach(c => {
    const id = c.dataset.link, done = !!S.leftRun[id], chip = c.querySelector(".link");
    c.classList.toggle("waiting", !done);
    if (chip) { chip.classList.toggle("pending", !done); chip.textContent = done ? `✓ Built on Example ${id}` : `Study Example ${id} on the left first →`; }
  });
}
function jumpLeft(id) {

function mcqBlock(t, m, i) {
  const k = t.n + "#" + i, st = S.mcq[k] || { pick: null, tries: 0 };
  const box = h("div", { class: "mcq" }, h("div", { class: "mq", html: m.q }));
  const grid = h("div", { class: "opts" }), why = h("div", { class: "why", hidden: true });
  const paint = () => {
    const cur = S.mcq[k] || { pick: null, tries: 0 };
    [...grid.children].forEach((b, j) => { b.classList.toggle("right", cur.pick === j && j === m.a); b.classList.toggle("wrong", cur.pick === j && j !== m.a); b.setAttribute("aria-pressed", cur.pick === j); });
    if (cur.pick == null) { why.hidden = true; return; }
    why.hidden = false;
    if (cur.pick === m.a) { why.className = "why ok"; why.innerHTML = "<b>Correct.</b> " + m.why; }
    else if (cur.tries >= 2) { why.className = "why no"; why.innerHTML = `<b>Not quite.</b> The answer is “${esc(m.opts[m.a])}”. ` + m.why; }
    else { why.className = "why no"; why.innerHTML = "<b>Not quite.</b> Run the code, look at the output again, and try another option."; }
  };
  m.opts.forEach((o, j) => grid.append(h("button", { class: "opt", type: "button", onclick: () => {
    const cur = S.mcq[k] || { pick: null, tries: 0 };
    if (cur.pick === m.a) return;
    S.mcq[k] = { pick: j, tries: cur.tries + (j === m.a ? 0 : 1) }; save(); paint(); refreshProgress();
  } }, h("span", { class: "k", text: "ABCD"[j] }), h("span", { text: o }))));
  box.append(grid, why); paint();
  return box;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


function obsBlock(t) {
  const id = "obs-" + t.n.replace(/\W/g, "_");

      card.append(codeCell({ key: "R" + t.n, code: t.code, side: "right", label: "Your code · Shift+Enter to run", hint: t.hint, onHint: () => { S.hints[t.n] = true; save(); }, onRun: (r, o, c) => {

const plain = s => String(s).replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
const cmt = (s, w = 92) => {
  const out = [];
  for (const para of plain(s).split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/)) {
      if (line && (line + " " + word).length > w) { out.push("# " + line); line = word; } else line = line ? line + " " + word : word;
    }
    out.push("# " + line);
  }
  return out.join("\n");
};
const slug = s => (s || "").trim().replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "");

function pyFileName() { return `CS3006_Prob_${slug(S.who.roll) || slug(S.who.name) || "student"}.py`; }
function buildPy() {
  const all = allTasks(), L = [];
  const now = new Date();
  L.push("# " + "=".repeat(78));
  L.push("# CS3006 Introduction to Data Science for Engineers");
  L.push("# Probability Distributions Lab: Bernoulli, Binomial, Poisson, Normal");
  L.push(`# Name     : ${S.who.name || "____"}`);
  L.push(`# Roll no. : ${S.who.roll || "____"}`);
  L.push(`# Saved    : ${now.toLocaleString()}`);
  L.push(`# Completed: ${all.filter(taskDone).length} / ${all.length} practice tasks`);
  L.push("#");
  L.push("# Each task is a '# %%' cell: run it cell by cell in Jupyter, VS Code or Spyder.");
  L.push("# Answers, observations and written answers are recorded as comments.");
  L.push("# " + "=".repeat(78), "");
  L.push("import math", "import pandas as pd", "import numpy as np", "import matplotlib.pyplot as plt", "from scipy import stats", "",
         'sales = pd.read_csv("q3_geometric_sales.csv")', 'defects = pd.read_csv("q1_binomial_defects.csv")',
         'calls = pd.read_csv("q2_poisson_helpdesk_calls.csv")', 'battery = pd.read_csv("normal_battery_life.csv")', "");
  for (const m of PR) {
    L.push("", "# " + "#".repeat(78), `# P${m.id}. ${m.title.toUpperCase()}`, "# " + "#".repeat(78));
    for (const t of m.tasks) {
      L.push("", `# %% ${t.n}  [${taskDone(t) ? "done" : "open"}]`);
      L.push(cmt("Task: " + t.q));
      if (t.code != null) {
        const mine = S.codes["R" + t.n];
        if (mine == null) L.push(t.code.trim() ? "# (starter code, not edited)" : "# (no code written)");
        if (S.hints[t.n]) L.push("# (hint viewed)");
        L.push((mine ?? t.code).replace(/\s+$/, ""));
        if (t.check) L.push(`# Auto-check: ${S.checks[t.n] === "pass" ? "PASSED" : S.checks[t.n] === "fail" ? "not passed" : "not run"}`);
        else if (!S.ran[t.n]) L.push("# (not run in the lab)");
      }
      if (t.mcq) t.mcq.forEach((q, i) => {
        const st = S.mcq[t.n + "#" + i];
        const ans = st && st.pick != null ? `${q.opts[st.pick]}  [${st.pick === q.a ? "correct" + (st.tries ? `, after ${st.tries} wrong` : "") : "wrong"}]` : "(not answered)";
        L.push(cmt(`Q: ${q.q}`), `#   -> ${plain(ans)}`);
      });
      if (t.written) L.push(cmt("Answer: " + ((S.obs[t.n] || "").trim() || "(none written)")));
      else if (t.obs) L.push(cmt("Observation: " + ((S.obs[t.n] || "").trim() || "(none written)")));
    }
  }
  return L.join("\n") + "\n";
}

async function savePy(btn) {
  const text = buildPy(), fname = pyFileName();
  if (!BUNDLED) {
    const url = URL.createObjectURL(new Blob([text], { type: "text/x-python" }));
    const a = h("a", { href: url, download: fname }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded " + fname);
    return;
  }
  // Inside claude.ai the page may only save .txt files; students rename before uploading.
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (!dl) { toast("Saving files is not available in this view. Use Copy instead."); return; }
  btn.disabled = true;
  try { await dl.save({ filename: fname + ".txt", data: text }); toast("Saved. Delete the .txt at the end of the file name before uploading."); }
  catch (e) { if (e && e.code !== "declined") toast("Could not save the file (" + (e.code || e.message) + "). Use Copy instead."); }
  finally { btn.disabled = false; }
}

  modal.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  (rl.value.trim() ? dlBtn : rl).focus();
});
